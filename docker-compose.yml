services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atoms_demo
      POSTGRES_USER: atoms_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "atoms_demo", "-d", "atoms_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: atoms_demo
      PGDATABASE: atoms_demo
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      QA_SOCKET_PATH: /run/atoms-qa/browser.sock
    volumes:
      - browser_socket:/run/atoms-qa
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  browser:
    profiles: [agent]
    build:
      context: .
      dockerfile: deploy/Dockerfile.qa
    restart: unless-stopped
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=deploy/chromium-seccomp.json
    mem_limit: 448m
    pids_limit: 160
    shm_size: 96m
    tmpfs:
      - /tmp:size=96m,mode=1777
    volumes:
      - browser_socket:/run/atoms-qa
    environment:
      QA_SOCKET_PATH: /run/atoms-qa/browser.sock
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({socketPath:process.env.QA_SOCKET_PATH,path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 3

volumes:
  browser_socket:
  postgres_data:
